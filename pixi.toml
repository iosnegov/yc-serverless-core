[workspace]
authors = ["Ilya Snegov <unweariedheart@gmail.com>"]
name = "yc-serverless-core"
version = "0.1.0"
license = "MIT-0"
repository = "https://github.com/snegoviol/yc-serverless-core"

channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0"

[tasks]

# =====================================================
# Environment Setup
# =====================================================
# Create local environment configuration file from template
# Copy .env.example to .env for initial project setup
# After copying, edit .env file to set your specific configuration values
copy-env = {cmd = "cp .env.example .env"}

[dependencies]
python = ">=3.15.1,<3.16"
requests = ">=2.34.2,<3"
pyjwt = ">=2.15.1,<3"
cryptography = ">=50.0.2,<51"
boto3 = ">=1.43.114,<2"
pydantic-settings = ">=2.16.1,<3"

[feature.test.dependencies]
ipykernel = "*"

[environments]
test = ["test"]
